[project]
name = "stylegan3"
version = "0.1.0"
description = "Metacreation Lab fork of NVlabs StyleGAN3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
    "codecarbon>=3.2.6",
    "glfw>=2.10.0",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "imgui==1.4.1",
    "matplotlib>=3.10.6",
    "ninja>=1.13.0",
    "numpy==1.26.4",
    "packaging>=25.0",
    "pillow>=11.3.0",
    "psutil>=7.0.0",
    "pyopengl>=3.1.10",
    "pyspng>=0.1.3",
    "requests>=2.32.5",
    "scipy>=1.16.1,<1.18.0",
    "setuptools<80",
    "tensorboard>=2.20.0",
    "torch==2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
torchvision = { index = "pytorch", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }