[project]
name = "stylegan3"
version = "0.1.0"
description = "Metacreation Lab fork of NVlabs StyleGAN3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "numpy>=2",
    "pillow>=8.3.1",
    "scipy>=1.7.1",
    "requests>=2.26.0",
    "tqdm>=4.62.2",
    "psutil>=5.8",
    "imageio>=2.9.0",
    "imageio-ffmpeg>=0.4.3",
    "matplotlib>=3.4.2",
    "pyspng>=0.1.3",
    "ninja>=1.10.2",
    "setuptools<80",
    "imgui==1.4.1",
    "glfw>=2.2.0",
    "pyopengl>=3.1.5",
    "torch==2.8.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
